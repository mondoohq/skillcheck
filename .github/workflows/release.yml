# WARNING: npm trusted publishing for the seven @mondoohq/skillcheck* packages is
# configured on npmjs.com for THIS workflow filename (release.yml). Renaming it
# breaks npm publishing until each package's trusted publisher is updated.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Republish the npm packages of an already-released version from its GitHub
  # release assets (no rebuild). Idempotent: only packages missing from the
  # registry are published, so this also repairs a partial publish.
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to (re)publish to npm, e.g. 0.3.0"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.17.0"

jobs:
  # Slack notifications are optional: they run only when the
  # SLACK_RELEASE_CHANNEL_ID repo variable is set (with the SLACK_BOT_TOKEN
  # secret), and a Slack failure never fails or blocks the release.
  notify-start:
    name: Notify release start
    if: ${{ vars.SLACK_RELEASE_CHANNEL_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.post.outputs.channel_id }}
      ts: ${{ steps.post.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Slack message
        run: node scripts/slack-release-message.mjs start > "$RUNNER_TEMP/slack.json"
        env:
          SLACK_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'republish' || 'release' }}

      - name: Post Slack message
        id: post
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack.json

  release:
    name: Build and create GitHub release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The publish job only needs the raw binaries and goreleaser's
      # artifacts.json, not the archives.
      - name: Upload binaries for the npm publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/skillcheck_*/skillcheck*
            dist/artifacts.json

  publish-npm:
    name: Publish npm packages
    needs: release
    # Runs after a tag build, or on its own for a manual republish.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # Includes the wait for platform packages to go live before the wrapper.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Check npm version
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + process.argv[1] + " is too old for trusted publishing (need >= 11.5.1)");
              process.exit(1);
            }' "$(npm --version)"

      - name: Download binaries
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist

      # Auth is OIDC trusted publishing only: there is deliberately no npm token
      # here. npm publish attaches provenance automatically.
      - name: Publish to npm
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/npm-package.mjs --version "$VERSION" --from-release --publish
          else
            node scripts/npm-package.mjs --version "$VERSION" --publish
          fi
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }} # --from-release downloads the release assets

  verify-npm:
    name: Verify npm release is installable
    needs: publish-npm
    if: ${{ !cancelled() && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify every package is live and installable
        run: bash scripts/verify-npm-release.sh "$VERSION"
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  notify-final:
    name: Notify release result
    needs: [notify-start, release, publish-npm, verify-npm]
    if: ${{ always() && needs.notify-start.outputs.ts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Slack message
        run: node scripts/slack-release-message.mjs final > "$RUNNER_TEMP/slack.json"
        env:
          SLACK_CHANNEL: ${{ needs.notify-start.outputs.channel }}
          SLACK_TS: ${{ needs.notify-start.outputs.ts }}
          SLACK_ALERT_GROUP: ${{ vars.SLACK_RELEASE_ALERT_GROUP_ID }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'republish' || 'release' }}
          RESULT_BUILD: ${{ needs.release.result }}
          RESULT_NPM_PUBLISH: ${{ needs.publish-npm.result }}
          RESULT_NPM_VERIFY: ${{ needs.verify-npm.result }}

      # Updates the start message in place.
      - name: Update Slack message
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack.json
